<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ヤハキー</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="images/logo.png" type="image/png">
<style>
    /* 태국어에 최적화된 Sarabun 폰트를 불러옵니다 */
    @import url('https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;700&display=swap');
    /* 히어로 타이틀(데바나가리)용 폰트 */
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;700;900&display=swap');
    
    body {
        font-family: 'Sarabun', sans-serif;
        /* 일본어는 글자 단위 개행이 정상. 금칙(。、」 등 줄머리 금지)만 지킨다 */
        word-break: normal;
		line-break: strict;
		overflow-wrap: break-word;
		overflow-x: hidden; /* 가로 스크롤 방지 */
    }
	/* 짧은 헤드라인은 어절이 쪼개지지 않게 (필요한 곳에서 inline-block 스팬으로 감쌈) */
	.keep-phrase { word-break: keep-all; }
.hero-copy {
    left: 50%;
    top: 82%;
    transform: translate(-50%, -50%);
    text-align: center;
    font-family: 'Noto Sans Devanagari', 'Sarabun', sans-serif;
}
.hero-copy .hero-line-lead,
.hero-copy .hero-line-main {
    font-size: clamp(2.1rem, 5vw, 3.7rem);
    font-weight: 900;
    line-height: 1.2;
    margin: 0;
    text-shadow: 2px 2px 8px rgba(0,0,0,0.45);
}
.hero-copy .hero-line-lead {
    color: #ffd23f;
}
.hero-copy .hero-line-main {
    color: #ffffff;
}
.hero-copy .hero-subtitle {
    font-size: clamp(1.5rem, 3.2vw, 2rem);
    font-weight: 400;
    color: #f2f2f2;
    margin: 0.9em 0 0;
    text-shadow: 1px 1px 4px rgba(0,0,0,0.5);
}
@media (max-width: 767px) {
    .hero-copy {
        left: 50%;
        top: 75%;
        bottom: 24%;
        transform: translateX(-50%);
        width: 92%;
    }
    /* 모바일에선 한 줄에 들어오도록 줄바꿈 금지 + 뷰포트 폭에 맞춰 축소 */
    .hero-copy .hero-line-lead,
    .hero-copy .hero-line-main { white-space: nowrap; }
    .hero-copy .hero-line-lead { font-size: clamp(1.4rem, 5.6vw, 2rem); }
    .hero-copy .hero-line-main { font-size: clamp(1.7rem, 7vw, 2.4rem); }
    .hero-copy .hero-subtitle { font-size: clamp(1.1rem, 4.2vw, 1.3rem); margin-top: 0.6em; }
}
</style>
</head>
<body class="bg-gray-50 text-gray-900 leading-relaxed">

<nav class="sticky top-0 z-50 bg-white/90 backdrop-blur-md border-b border-gray-100">
    <div class="max-w-6xl mx-auto px-6 py-4 flex justify-between items-center">
        <a href="#"><img src="images/logotype.png" alt="पाकाहारा Logo" class="h-12"></a>
        
        <div class="hidden md:flex items-center space-x-8 font-medium text-sm">
            <a href="#demo" class="bg-blue-600 text-white px-5 py-2.5 rounded-lg hover:bg-blue-700 transition flex items-center justify-center leading-none">
                今すぐ体験する
            </a>
        </div>
    </div>
</nav>

<section class="w-full relative">
    <picture>
        <source media="(max-width: 767px)" srcset="images/hero_mobile.png">
        <img src="images/hero.png" alt="Hatabang Hero" class="w-full object-cover">
    </picture>
    <div class="absolute leading-snug hero-copy">
        <p class="hero-line-lead">私たちはフリック世代。</p>
        <p class="hero-line-main">ヤハに変えて勝る。</p>
        <p class="hero-subtitle"></p>
    </div>
</section>

<section id="intro" class="pt-14 pb-16 md:py-20 bg-white text-center px-6">
    <div class="max-w-4xl mx-auto">
        <p class="text-blue-600 font-bold text-2xl md:text-5xl tracking-tight leading-snug">
            <span class="inline-block keep-phrase">左手にテンキー、</span><br class="md:hidden">
            <span class="inline-block keep-phrase">右手でフリック</span>
        </p>
        <h1 class="text-[3.75rem] md:text-[100px] font-black mt-2 md:mt-4 leading-none md:leading-[1.2] text-gray-800 whitespace-nowrap" translate="no">
            <span class="text-blue-600">ヤハキー</span>
        </h1>
        <div class="mt-8 md:mt-12">
            <img src="images/pc.png" alt="ヤハキーのキー配列" class="mx-auto w-full max-w-xl drop-shadow-2xl rounded-xl">
        </div>
    </div>
</section>

    <section id="how-to" class="py-14 md:py-20 max-w-6xl mx-auto px-6 border-t border-gray-100">
        <div class="flex flex-col md:flex-row items-center gap-8 md:gap-12">
            <div class="md:w-1/2">
                <img src="images/mnemonic.png" alt="ဗျည်းရိုက်နှိပ်ပုံစံ" class="w-full rounded-xl border border-gray-100 shadow-sm">
            </div>
            <div class="md:w-1/2 text-center md:text-left">
                <h3 class="text-xl md:text-2xl font-bold mb-4 md:mb-6 text-gray-800 leading-snug">
                    一度見たら絶対に忘れられない<br class="md:hidden"><span class="keep-phrase">テンキー配列</span>
                </h3>
                <ul class="space-y-4 text-gray-600">
                    <li class="block md:flex md:items-start">
                        <span class="text-blue-500 mr-2 md:mr-3 md:mt-1">✓</span>
                        <span>初日からすぐにタッチタイピングを<br class="md:hidden">試してみてください！</span>
					</li>
                </ul>
            </div>
        </div>
    </section>

    <section class="py-14 md:py-20 bg-gray-50">
        <div class="max-w-6xl mx-auto px-6">
            <div class="flex flex-col md:flex-row-reverse items-center gap-8 md:gap-12">
                <div class="md:w-1/2">
                    <img src="images/arrows.png" alt="သရရိုက်နှိပ်ပုံစံ" class="w-full rounded-xl border border-gray-100 shadow-sm">
                </div>
                <div class="md:w-1/2 text-center md:text-left">
				<h3 class="text-xl md:text-2xl font-bold mb-4 text-gray-800 leading-snug">
					テキスト選択も<br class="md:hidden"><span class="keep-phrase">これ以上ない</span>ほど便利です！
				</h3>

				<ul class="space-y-4 text-gray-600">
					<li class="block md:flex md:items-start">
						<span class="text-blue-500 mr-2 md:mr-3 md:mt-1">✓</span>
						<span class="text-lg">フリックキーは自動的に<br class="md:hidden">矢印キーとして機能します。</span>
					</li>
				</ul>
                </div>
            </div>
        </div>
    </section>



<section id="demo" class="py-16 md:py-24 text-center px-6">
    <h2 class="text-xl md:text-3xl font-bold mb-10 md:mb-16 text-balance">今すぐ体験してみてください。</h2>
    <div class="max-w-2xl mx-auto">

        <!-- PC Card -->
        <div class="p-6 md:p-10 rounded-3xl bg-white border border-gray-100 shadow-xl flex flex-col items-center relative overflow-hidden">
            <h4 class="text-xl font-bold mb-6 text-gray-800">ヤハキー Demo</h4>
            <div class="h-32 flex items-center mb-8">
                <img src="images/pc.png" alt="PC demo" class="max-h-full w-auto object-contain grayscale hover:grayscale-0 transition duration-500">
            </div>
            <a href="try.html" class="inline-block w-full py-3 bg-gray-900 text-white rounded-xl font-bold hover:bg-blue-600 transition text-center">体験する</a>

            <!-- 모바일에서 볼 때: PC 안내 오버레이 -->
            <div id="pc-overlay"
                 class="absolute inset-0 rounded-3xl flex-col items-center justify-center gap-4 px-6"
                 style="display:none; background:rgba(255,255,255,0.96); backdrop-filter:blur(4px);">
                <h4 class="text-xl font-bold text-gray-800">ヤハキー Demo</h4>
                <span class="text-5xl">🖥️</span>
                <p class="text-sm text-gray-500 text-center">体験はPCからのみ可能です。</p>
            </div>
        </div>

    </div>
</section>



    <footer class="py-12 border-t border-gray-100 text-center text-gray-400 text-sm">
        <p>© 2026 YAHAKEY All rights reserved.</p>
    </footer>

</body>
</html>
