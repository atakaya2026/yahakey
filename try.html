<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ヤリナ</title>
  <link rel="icon" href="images/logo.png" type="image/png">
  <style>
    body {
      font-family: "Noto Sans KR", sans-serif;
      margin: 0;
      padding: 0 0 80px 0; /* ← 아래쪽에 60px 여백 */
      background: #fff;
      color: #222;
    }
    h1 {
      font-size: 3em;
	  margin-top: 30px;
	  margin-left: 80px;
      margin-bottom: 20px;
    }
    .container {
      display: flex;
      align-items: flex-start;
      gap: 40px;
    }
    .text {
      flex: 1;
      line-height: 1.7;
	  margin-left: 80px;
      font-size: 1.3em;
    }
    .illustration {
      flex: 1;
    }
    .illustration img {
		width: 100%;
		max-width: 500px;
		border-radius: 6px;
		box-shadow: 0 2px 8px rgba(0,0,0,0.1);
		margin-top: 24px;  /* 원하는 만큼 내려줌 */
		margin-left: 15px
}
    /* ── 버튼 래퍼 ── */
    .buttons {
      margin-top: 60px;
      display: flex;
      justify-content: center;
      gap: 80px;
    }

    /* 단계 뱃지 + 버튼을 세로로 묶는 컨테이너 */
    .btn-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    /* Step 뱃지 */
    .step-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-size: 1.15em;
      font-weight: 800;
      letter-spacing: 0.04em;
      padding: 6px 20px;
      border-radius: 999px;
      color: #fff;
    }
    .step-badge.green  { background: #4a9e28; }
    .step-badge.orange { background: #c9760f; }
    .step-badge.blue   { background: #2a52a0; }

    .step-badge .step-num {
      background: rgba(255,255,255,0.3);
      border-radius: 50%;
      width: 26px;
      height: 26px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 1em;
      font-weight: 900;
    }
    .btn {
      display: flex;
      align-items: center;
	  width: 420px;   /* 원하는 고정값으로 */
	  height: 90px;
	  justify-content: center;
      gap: 10px;
      padding: 18px 28px;
      font-size: 1.6em;
      font-weight: 600;
      border-radius: 12px;
      border: none;
      cursor: pointer;
      color: #fff;
    }
    .btn img {
      height: 36px;
    }
    .btn-label {
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.25;
    }
    .btn-sub {
      font-size: 0.9em;
      font-weight: 500;
      white-space: nowrap;
    }
    .btn-green {
      background: #6cbc43;
    }
    .btn-orange {
      background: #e2932e;
    }
    .btn-blue {
      background: #3f6fb8;
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
<button onclick="location.href='index.html'" 
        style="position: fixed; top: 20px; right: 78px; 
               padding: 10px 18px; font-size: 1.1em; 
               background-color: #3f6fb8; color: #fff; 
               border: none; border-radius: 8px; cursor: pointer; 
               box-shadow: 0 2px 6px rgba(0,0,0,0.15);
               z-index: 9999;">
  Home
</button>



  <h1>ヤリナ体験</h1>
  <div class="container">
    <div class="text">
      <p>ヤリナ体験場へようこそ。</p>
      <p>
        あなたは今日からタッチタイピングができるようになります。
      </p>
      <p>
        まずは指の練習として、モグラ叩きから始めましょう。
      </p>
    </div>
    <div class="illustration">
      <img src="img/trypc.png" alt="미니 맵 체험 삽화">
    </div>
  </div>
  <div class="buttons">
  <!-- 두더지 게임 버튼 -->
    <div class="btn-wrapper">
      <div class="step-badge green">
        Step 1
      </div>
      <button class="btn btn-green" onclick="location.href='mole.html'">
        <img src="img/icon_mole.png" alt="두더지 게임 아이콘">
        <span class="btn-label">
          <span class="btn-main">モグラ叩き</span>
          <span class="btn-sub">(指のたどたどしい一歩)</span>
        </span>
      </button>
    </div>

    <!-- 2단계: 튜토리얼 -->
    <div class="btn-wrapper">
      <div class="step-badge orange">
        Step 2
      </div>
      <button class="btn btn-orange" onclick="location.href='tutorial.html'">
        <img src="images/flick.png" alt="튜토리얼 아이콘">
        ヤリナ体験
      </button>
    </div>

</div>




</body>
</html>
